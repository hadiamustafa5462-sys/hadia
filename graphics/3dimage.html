<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static 3D Brown Cube</title>
    <style>
        body { margin: 0; background-color: #f0f0f0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee);

        // 2. Camera setup - Positioned at an angle to show 3D depth
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(1.5, 1.5, 2); // Side, Top, Front view
        camera.lookAt(0, 0, 0); // Point camera at the cube

        // 3. Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 4. Create the Cube (Brown color)
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x5C4033, // Deep Brown
            roughness: 0.5 
        });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // 5. Lights (Essential to see 3D faces)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const light = new THREE.DirectionalLight(0xffffff, 1.5);
        light.position.set(2, 4, 3);
        scene.add(light);

        // 6. Simple Render (No rotation logic here)
        function render() {
            renderer.render(scene, camera);
        }

        // Handle resizing the window
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            render();
        });

        render();
    </script>
</body>
</html>
