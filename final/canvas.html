<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro JS Paint</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f4f9;
        }

        .toolbar {
            padding: 15px;
            background: #2c3e50;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            color: white;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="color"], input[type="range"] {
            cursor: pointer;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        #eraserBtn { background-color: #f39c12; color: white; }
        #eraserBtn.active { background-color: #d35400; outline: 2px solid white; }
        
        #clearBtn { background-color: #e74c3c; color: white; }
        #clearBtn:hover { background-color: #c0392b; }

        canvas {
            margin-top: 20px;
            border: 2px solid #2c3e50;
            background-color: white;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="tool-group">
            <label>Color:</label>
            <input type="color" id="colorPicker" value="#000000">
        </div>

        <div class="tool-group">
            <label>Size:</label>
            <input type="range" id="sizePicker" min="1" max="50" value="5">
            <span id="sizeVal">5</span>
        </div>

        <div class="tool-group">
            <button id="eraserBtn">Eraser</button>
            <button id="clearBtn">Clear All</button>
        </div>
    </div>

    <canvas id="paintCanvas"></canvas>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        const sizePicker = document.getElementById('sizePicker');
        const sizeVal = document.getElementById('sizeVal');
        const eraserBtn = document.getElementById('eraserBtn');
        const clearBtn = document.getElementById('clearBtn');

        canvas.width = window.innerWidth * 0.9;
        canvas.height = 600;

        let painting = false;
        let isEraser = false;

        // Toggle Eraser
        eraserBtn.addEventListener('click', () => {
            isEraser = !isEraser;
            eraserBtn.classList.toggle('active');
            eraserBtn.innerText = isEraser ? "Brush Mode" : "Eraser";
        });

        // Update Size Label
        sizePicker.addEventListener('input', () => {
            sizeVal.innerText = sizePicker.value;
        });

        function startPosition(e) {
            painting = true;
            draw(e); 
        }

        function finishedPosition() {
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            ctx.lineWidth = sizePicker.value;
            ctx.lineCap = 'round';

            if (isEraser) {
                // This mode "erases" to transparency
                ctx.globalCompositeOperation = 'destination-out';
            } else {
                // Normal drawing mode
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = colorPicker.value;
            }

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', finishedPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseleave', finishedPosition);

        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });
    </script>
</body>
</html>
